<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HR Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  body { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  #login-view, #chat-view { display: none; }
  #login-view.active, #chat-view.active { display: block; }
  input, button { font-family: inherit; }
  input[type=text], input[type=password] { padding: 8px; width: 240px; margin-right: 8px; }
  button { padding: 8px 16px; cursor: pointer; }
  #login-error { color: #b00020; margin-top: 8px; }
  #messages { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 420px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 12px; }
  .msg .role { font-weight: 600; font-size: 0.85rem; color: #555; }
  .msg .text { white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #fde68a; margin-left: 6px; }
  #chat-form { display: flex; gap: 8px; }
  #chat-input { flex: 1; padding: 8px; }
  #topbar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div id="login-view">
  <h1>HR Portal — Log in</h1>
  <div>
    <input type="text" id="employee-id" placeholder="Employee ID (e.g. E1001)" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Log in</button>
  </div>
  <div id="login-error"></div>
</div>

<div id="chat-view">
  <div id="topbar">
    <h1>HR Portal — Chat</h1>
    <button id="logout-btn">Log out</button>
  </div>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Ask an HR question..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
let token = null;

const loginView = document.getElementById("login-view");
const chatView = document.getElementById("chat-view");
const messagesEl = document.getElementById("messages");

function showLogin() {
  token = null;
  loginView.classList.add("active");
  chatView.classList.remove("active");
  messagesEl.innerHTML = "";
}

function showChat() {
  loginView.classList.remove("active");
  chatView.classList.add("active");
}

function addMessage(role, text, escalated) {
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `<div class="role">${role}</div><div class="text"></div>`;
  const textEl = div.querySelector(".text");
  textEl.textContent = text;
  if (escalated) markEscalated(textEl);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return textEl;
}

function appendToMessage(textEl, chunk) {
  textEl.textContent += chunk;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function markEscalated(textEl) {
  if (!textEl || textEl.parentElement.querySelector(".badge")) return;
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = "deep reasoning";
  textEl.parentElement.querySelector(".role").appendChild(badge);
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const employee_id = document.getElementById("employee-id").value.trim();
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("login-error");
  errorEl.textContent = "";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employee_id, password }),
    });
    if (!res.ok) {
      const err = await res.json();
      errorEl.textContent = err.detail || "Login failed";
      return;
    }
    const data = await res.json();
    token = data.token;
    showChat();
  } catch (e) {
    errorEl.textContent = "Could not reach the server.";
  }
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  if (token) {
    await fetch("/logout", { method: "POST", headers: { Authorization: `Bearer ${token}` } });
  }
  showLogin();
});

document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const message = input.value.trim();
  if (!message || !token) return;
  input.value = "";
  addMessage("You", message, false);

  let answerEl = null;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ message }),
    });
    if (res.status === 401) {
      showLogin();
      return;
    }
    if (!res.ok || !res.body) {
      addMessage("Assistant", "Something went wrong reaching the server.", false);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop(); // last chunk may be incomplete, keep buffering it

      for (const raw of events) {
        if (!raw.startsWith("data: ")) continue;
        const evt = JSON.parse(raw.slice(6));
        if (evt.type === "token") {
          if (!answerEl) answerEl = addMessage("Assistant", "", false);
          appendToMessage(answerEl, evt.text);
        } else if (evt.type === "done") {
          if (evt.escalated) markEscalated(answerEl);
        } else if (evt.type === "error") {
          if (!answerEl) answerEl = addMessage("Assistant", "", false);
          appendToMessage(answerEl, evt.message);
        }
      }
    }
  } catch (e) {
    if (!answerEl) addMessage("Assistant", "Something went wrong reaching the server.", false);
  }
});

showLogin();
</script>

</body>
</html>
